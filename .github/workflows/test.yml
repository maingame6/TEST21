name: test
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m ace0.demo --mode safe --sample-size 32
      - run: python -m ace0.demo --mode unsafe --sample-size 32
